{
  # Device profile (acceleration layer, not a gate).
  # Complements kernel_profiles/*.conf (correctness via uname -r match).
  # Only put values that are constant across boots. KASLR slide varies per boot.
  product = "m3quew"
  device = "m3q"
  model = "Samsung SM-S948U1 (S26 Ultra)"
  soc = "SM8750-class"

  # 4K page size (standard for Android 16 GKI on this class).
  page_size = 4096

  # Runtime-calibrated on this device: 0xffffff7f09200000 (confidence 1/18).
  # Not marked trusted - calibrate-b will re-scan each boot for safety.
  page_offset = 0xffffff7f09200000
  page_offset_trusted = 0

  # task_struct slab object_size from calib_a (includes in-task kernel stack).
  task_struct_object_size = 5696

  flow = {
    calib_a = {
      probe = 2048
      hold = 2
    }
  }

  _notes = "Samsung Galaxy S26 Ultra (SM-S948U1 / m3quew-m3q / Android 16 / 6.12.69-android16-6-pa4ef354). Ported with verified kallsyms addresses from vmlinux.elf. page_offset left untrusted due to low calib-b confidence; re-verify on stable boot."
}
